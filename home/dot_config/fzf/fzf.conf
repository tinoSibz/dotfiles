# fzf configuration
# https://junegunn.github.io/fzf/reference/#fzf_default_opts_file
# Loaded via FZF_DEFAULT_OPTS_FILE in ~/.config/zsh/.zshrc

# Nord theme
# https://www.nordtheme.com
--color=fg:#D8DEE9,bg:#2E3440,hl:#A3BE8C
--color=fg+:#D8DEE9,bg+:#434C5E,hl+:#A3BE8C
--color=info:#88C0D0,prompt:#81A1C1,pointer:#BF616A
--color=marker:#D08888,spinner:#EBCB8B,header:#8FBCBB
--color=border:#4C566A,gutter:#434C5E

# Layout
--layout=reverse
--border=rounded
--height=50%

# Prompt and pointer
--prompt="  "
--pointer="▶"
--marker="✓"
--separator="─"
--scrollbar="│"

# Behaviour
--cycle
--scroll-off=3
--info=inline-right

# File walker — built-in, no external command needed
# Includes hidden files, skips common noise directories
--walker=file,dir,follow,hidden
--walker-skip=.git,node_modules,target,.DS_Store
